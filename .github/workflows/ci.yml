name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repo layout (debug)
        run: |
          echo "Workspace: $(pwd)"
          ls -la
          echo "Recursive tree (depth 3):"
          find . -maxdepth 3 -mindepth 1 -print | sed -n '1,200p'

      - name: Find package.json and set working dir
        id: findpkg
        run: |
          PKG=$(find . -maxdepth 6 -type f -name package.json | head -n1 || true)
          if [ -z "$PKG" ]; then
            echo "No package.json found in the repo workspace."
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "package.json found at: $PKG"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Use Node.js (setup and cache)
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ou '22' / '20' se preferir
          cache: 'npm'
          cache-dependency-path: ${{ steps.findpkg.outputs.dir }}/package-lock.json

      - name: Install dependencies (uses lockfile)
        working-directory: ${{ steps.findpkg.outputs.dir }}
        run: |
          if [ -f package-lock.json ]; then
            echo "Using package-lock.json -> npm ci"
            npm ci
          elif [ -f yarn.lock ]; then
            echo "Using yarn.lock -> yarn install --frozen-lockfile"
            yarn install --frozen-lockfile
          else
            echo "No lockfile found -> npm install"
            npm install
          fi

      - name: Build
        working-directory: ${{ steps.findpkg.outputs.dir }}
        env:
          NODE_ENV: production
        run: npm run build

      - name: Run lint (optional)
        working-directory: ${{ steps.findpkg.outputs.dir }}
        run: npm run lint || true